name: Build and publish WordPress plugin ZIP

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag, for example v1.0.0'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: plugin-release-${{ github.ref_name }}-${{ inputs.version || 'tag' }}
  cancel-in-progress: false

jobs:
  package:
    name: Validate, package and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate WordPress plugin and build installable ZIP
        id: build
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG="$REQUESTED_VERSION"
          else
            TAG="$REF_NAME"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag must be in the form v1.2.3"
            exit 1
          fi
          if [[ ! -f fa-wp-speedup.php ]]; then
            echo "::error::Missing fa-wp-speedup.php at repository root. Push the actual plugin source before publishing."
            exit 1
          fi
          export TAG
          python3 - <<'PY'
          import os
          import re
          import sys
          import zipfile
          from pathlib import Path

          root = Path.cwd()
          slug = "fa-wp-speedup"
          tag = os.environ["TAG"]
          version = tag[1:]
          plugin = root / (slug + ".php")
          header = plugin.read_text(encoding="utf-8", errors="replace")[:8192]

          if not re.search(r"(?im)^\s*\*?\s*Plugin Name\s*:\s*\S+", header):
              sys.exit("ERROR: fa-wp-speedup.php needs a valid WordPress 'Plugin Name:' header.")
          match = re.search(r"(?im)^\s*\*?\s*Version\s*:\s*([^\r\n*]+)", header)
          if not match:
              sys.exit("ERROR: fa-wp-speedup.php needs a 'Version:' header.")
          if match.group(1).strip() != version:
              sys.exit(f"ERROR: Plugin Version {match.group(1).strip()!r} does not match release {version!r}.")

          excluded_dirs = {
              ".git", ".github", ".idea", ".vscode", ".venv", "__pycache__",
              "node_modules", "tests", "test", "docs", "dist", "build", "coverage",
          }
          excluded_names = {".gitignore", ".gitattributes", ".editorconfig", ".DS_Store"}
          out_dir = root / "dist"
          out_dir.mkdir(exist_ok=True)
          output = out_dir / f"{slug}-{version}.zip"
          members = []

          with zipfile.ZipFile(output, "w", zipfile.ZIP_DEFLATED, compresslevel=9) as bundle:
              for path in sorted(root.rglob("*")):
                  relative = path.relative_to(root)
                  if any(part in excluded_dirs for part in relative.parts):
                      continue
                  if relative.name in excluded_names or path.suffix.lower() == ".zip":
                      continue
                  if relative == Path("README.md"):
                      continue
                  if path.is_symlink():
                      sys.exit(f"ERROR: Symbolic links are not allowed in the installation package: {relative}")
                  if not path.is_file():
                      continue
                  archive_name = f"{slug}/{relative.as_posix()}"
                  bundle.write(path, archive_name)
                  members.append(archive_name)

          if f"{slug}/{slug}.php" not in members:
              sys.exit("ERROR: Main plugin file is missing from archive.")
          with zipfile.ZipFile(output) as bundle:
              if bundle.testzip() is not None:
                  sys.exit("ERROR: ZIP integrity check failed.")
          print(f"Created {output.name} with {len(members)} files.")
          PY
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "zip=dist/fa-wp-speedup-${TAG#v}.zip" >> "$GITHUB_OUTPUT"

      - name: Keep a downloadable build artifact
        uses: actions/upload-artifact@v4
        with:
          name: fa-wp-speedup-${{ steps.build.outputs.tag }}
          path: ${{ steps.build.outputs.zip }}
          if-no-files-found: error

      - name: Publish ZIP to GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.build.outputs.tag }}
          ZIP_FILE: ${{ steps.build.outputs.zip }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP_FILE" --clobber
          else
            gh release create "$TAG" "$ZIP_FILE" \
              --target "$GITHUB_SHA" \
              --title "FA WP Speedup $TAG" \
              --notes "Install the attached fa-wp-speedup ZIP from WordPress → Plugins → Add New → Upload Plugin."
          fi
