name: faws-dev
services:
  db:
    image: mariadb:11.4@sha256:250e1609e93c0e6aecf64bfbab2d84d5e89d2481540fe77447ff6c855c3b1873
    environment:
      MARIADB_RANDOM_ROOT_PASSWORD: '1'
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: ${FAWS_DB_PASSWORD:?Run dev/start.sh}
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 2s
      timeout: 5s
      retries: 30
  wordpress:
    image: wordpress:php8.1-apache@sha256:f73396626d2f1b89d4c556917c15f55cfcc6b5f80595205516e490f0f04015e4
    ports:
      - '127.0.0.1:8080:80'
    environment: &wp-env
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${FAWS_DB_PASSWORD}
      WORDPRESS_DEBUG: '1'
      WORDPRESS_CONFIG_EXTRA: "define('WP_DEBUG_LOG', true); define('WP_DEBUG_DISPLAY', false); define('DISABLE_WP_CRON', true);"
    volumes: &wp-volumes
      - wp:/var/www/html
      - ../:/var/www/html/wp-content/plugins/fa-wp-speedup:ro
      - ${FAWS_DEV_STATE:-/workspace/.faws-dev}/artifacts:/fixtures:ro
    depends_on:
      db:
        condition: service_healthy
  cli:
    image: wordpress:cli-php8.1@sha256:ab5fb76caa861f32c21e1d95a057f52007f4af7130fb16a0f68874dabe0549a4
    user: '33:33'
    environment:
      <<: *wp-env
      FAWS_ADMIN_PASSWORD: ${FAWS_ADMIN_PASSWORD}
    volumes: *wp-volumes
    profiles: [tools]
    entrypoint: [wp]
volumes:
  db:
  wp:
